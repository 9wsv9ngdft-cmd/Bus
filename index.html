<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #1d1d1b;
    --muted: #6b6a66;
    --accent: #e4572e;
    --line: #e3e0d8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #22221f; --ink: #f1efe9; --muted: #a09e97; --line: #34332f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  header svg { width: 40px; height: 40px; }
  h1 { font-size: 32px; margin: 0; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; margin-bottom: 14px;
  }
  form { display: grid; gap: 10px; }
  label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
  input {
    font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
  }
  .row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 14px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--muted); padding: 4px 8px; font-weight: 500; }
  .trip { display: flex; align-items: center; gap: 14px; }
  .badge {
    min-width: 48px; height: 48px; border-radius: 12px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 18px; padding: 0 8px;
  }
  .info { flex: 1; min-width: 0; }
  .stop { font-weight: 600; }
  .next { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .next b { color: var(--ink); }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 28px 0 12px; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect x="6" y="6" width="36" height="32" rx="7" fill="#e4572e"/>
      <rect x="11" y="11" width="26" height="12" rx="3" fill="#fff"/>
      <circle cx="15" cy="31" r="2.5" fill="#fff"/><circle cx="33" cy="31" r="2.5" fill="#fff"/>
      <rect x="11" y="38" width="6" height="5" rx="1.5" fill="#1d1d1b"/><rect x="31" y="38" width="6" height="5" rx="1.5" fill="#1d1d1b"/>
    </svg>
    <h1>Bus</h1>
  </header>
  <p class="sub">Vos lignes favorites et le prochain départ, en un coup d'œil.</p>

  <div class="card">
    <form id="form">
      <div class="row">
        <label>Ligne<input id="line" placeholder="ex. 38" required maxlength="6"></label>
        <label>Arrêt<input id="stop" placeholder="ex. Gare du Nord" required></label>
      </div>
      <label>Horaires de passage (séparés par des virgules)
        <input id="times" placeholder="07:12, 07:42, 08:12, 12:30, 18:05" required>
      </label>
      <button type="submit">Ajouter le trajet</button>
    </form>
  </div>

  <h2>Mes trajets</h2>
  <div id="list"></div>
</main>

<script>
  const KEY = "bus-trajets";
  let trips = [];
  try { trips = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { trips = []; }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(trips)); } catch (e) {}
  }

  function parseTimes(text) {
    return text.split(",")
      .map(t => t.trim())
      .filter(t => /^\d{1,2}[:h]\d{2}$/.test(t))
      .map(t => { const [h, m] = t.split(/[:h]/).map(Number); return h * 60 + m; })
      .filter(min => min >= 0 && min < 24 * 60)
      .sort((a, b) => a - b);
  }

  function fmt(min) {
    return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
  }

  function nextDeparture(times) {
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    const next = times.find(t => t >= cur);
    if (next === undefined) return times.length ? `Plus de bus aujourd'hui · demain <b>${fmt(times[0])}</b>` : "Aucun horaire";
    const wait = next - cur;
    if (wait === 0) return `Prochain bus <b>maintenant</b>`;
    if (wait < 60) return `Prochain bus dans <b>${wait} min</b> (${fmt(next)})`;
    return `Prochain bus à <b>${fmt(next)}</b>`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render() {
    const list = document.getElementById("list");
    if (!trips.length) {
      list.innerHTML = '<div class="card empty">Aucun trajet pour l\'instant.<br>Ajoutez votre première ligne ci-dessus.</div>';
      return;
    }
    list.innerHTML = trips.map((t, i) => `
      <div class="card trip">
        <div class="badge">${escapeHtml(t.line)}</div>
        <div class="info">
          <div class="stop">${escapeHtml(t.stop)}</div>
          <div class="next">${nextDeparture(t.times)}</div>
        </div>
        <button class="ghost" data-i="${i}" aria-label="Supprimer">✕</button>
      </div>`).join("");
  }

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const line = document.getElementById("line").value.trim();
    const stop = document.getElementById("stop").value.trim();
    const times = parseTimes(document.getElementById("times").value);
    if (!line || !stop || !times.length) return;
    trips.push({ line, stop, times });
    save(); render();
    e.target.reset();
  });

  document.getElementById("list").addEventListener("click", e => {
    const i = e.target.dataset.i;
    if (i === undefined) return;
    trips.splice(Number(i), 1);
    save(); render();
  });

  render();
  setInterval(render, 30000);
</script>
</body>
</html>
